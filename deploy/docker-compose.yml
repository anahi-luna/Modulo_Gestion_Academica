version: "3.9"

services:

  backend:

    build:
      context: ../backend
      dockerfile: Dockerfile

    container_name: gestion-academica-backend

    ports:
      - "5000:5000"

    volumes:
      - ../backend:/app

    restart: unless-stopped


  frontend:

    build:
      context: ../frontend
      dockerfile: Dockerfile

    container_name: gestion-academica-frontend

    ports:
      - "5173:5173"

    volumes:
      - ../frontend:/app
      - /app/node_modules

    depends_on:
      - backend

    restart: unless-stopped